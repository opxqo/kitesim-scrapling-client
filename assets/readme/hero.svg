<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Kitesim Relay</title>
  <desc id="desc">Kitesim Relay 将多个 Kitesim 账户的号码、短信与验证码汇聚为一条由服务端 Token 与版本化 JSON Blob 支撑的只读信号链。</desc>

  <rect x="1" y="1" width="1198" height="458" rx="26" fill="#0B1020" stroke="#263147" stroke-width="2"/>
  <path d="M714 48V412" stroke="#263147" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(62 54)">
      <rect width="64" height="64" rx="20" fill="#4F46E5"/>
      <path d="M18 44V20m0 12h9m0-12v24m9-24v24m0-12h10m0-12v24" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="51" cy="13" r="5" fill="#34D399"/>
    </g>

    <text x="150" y="79" fill="#A5B4FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" letter-spacing="1.5">PRIVATE · READ-ONLY · MULTI-ACCOUNT</text>
    <text x="62" y="214" fill="#F8FAFC" font-size="78" font-weight="760" letter-spacing="-3.5">Kitesim Relay</text>
    <text x="62" y="276" fill="#CBD5E1" font-size="38" font-weight="640">多账户号码与验证码</text>
    <text x="62" y="326" fill="#CBD5E1" font-size="38" font-weight="640">一条受保护的只读信号链</text>

    <g transform="translate(62 382)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="650">
      <circle cx="6" cy="-6" r="6" fill="#34D399"/>
      <text x="24" y="1" fill="#A7F3D0">GET ONLY</text>
      <text x="166" y="1" fill="#475569">/</text>
      <text x="190" y="1" fill="#94A3B8">SERVER-HELD TOKENS</text>
      <text x="430" y="1" fill="#475569">/</text>
      <text x="454" y="1" fill="#94A3B8">VERSIONED JSON BLOB</text>
    </g>

    <g transform="translate(748 50)">
      <text x="0" y="22" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" letter-spacing="1.4">TRUSTED RELAY</text>
      <rect x="0" y="44" width="388" height="318" rx="20" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 9"/>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700">
        <text x="16" y="120" fill="#A5B4FC">TOKEN 01</text>
        <circle cx="126" cy="112" r="13" fill="#111A30" stroke="#4F46E5" stroke-width="2"/>
        <text x="16" y="211" fill="#A5B4FC">TOKEN 02</text>
        <circle cx="126" cy="203" r="13" fill="#111A30" stroke="#4F46E5" stroke-width="2"/>
        <text x="16" y="302" fill="#A5B4FC">TOKEN 20</text>
        <circle cx="126" cy="294" r="13" fill="#111A30" stroke="#4F46E5" stroke-width="2"/>
      </g>

      <path d="M139 112H150C176 112 176 203 200 203M139 203H200M139 294H150C176 294 176 203 200 203" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
      <circle cx="200" cy="203" r="7" fill="#34D399"/>

      <g transform="translate(218 167)">
        <rect width="72" height="72" rx="20" fill="#4F46E5"/>
        <path d="M20 51V21m0 15h10m0-15v30m10-30v30m0-15h12m0-15v30" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="58" cy="14" r="5" fill="#34D399"/>
      </g>

      <path d="M290 203H330V136M330 203V270" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
      <circle cx="330" cy="136" r="6" fill="#34D399"/>
      <circle cx="330" cy="270" r="6" fill="#34D399"/>
      <text x="350" y="130" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">NUMBER</text>
      <text x="350" y="159" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700">+•• •101</text>
      <text x="350" y="264" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">OTP</text>
      <text x="350" y="296" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700" letter-spacing="2">••• •••</text>
    </g>
  </g>
</svg>
