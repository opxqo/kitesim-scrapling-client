<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Kitesim Relay 只读数据链</title>
  <desc id="desc">React 控制台优先读取 EdgeOne Blob 快照，只有显式刷新才经 Python 与 Scrapling 访问 Kitesim GET API。</desc>

  <rect x="1" y="1" width="1198" height="428" rx="26" fill="#10141B" stroke="#303746" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="60" y="72" fill="#FFFFFF" font-size="46" font-weight="740">一条只读信号链</text>
    <text x="60" y="107" fill="#98A2B3" font-size="20">普通读取停在 Blob；手动或定时刷新才访问上游。</text>

    <g transform="translate(60 146)">
      <g>
        <rect width="190" height="112" rx="18" fill="#1B2230" stroke="#394153" stroke-width="2"/>
        <circle cx="30" cy="31" r="8" fill="#4F46E5"/>
        <text x="50" y="39" fill="#A5B4FC" font-size="18" font-weight="700">01</text>
        <text x="22" y="76" fill="#FFFFFF" font-size="27" font-weight="730">React</text>
        <text x="22" y="101" fill="#98A2B3" font-size="18">Dashboard</text>
      </g>

      <path d="M198 56H224" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
      <path d="M216 48l8 8-8 8" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(232)">
        <rect width="190" height="112" rx="18" fill="#192A28" stroke="#22665A" stroke-width="2"/>
        <circle cx="30" cy="31" r="8" fill="#34D399"/>
        <text x="50" y="39" fill="#A7F3D0" font-size="18" font-weight="700">02</text>
        <text x="22" y="76" fill="#FFFFFF" font-size="27" font-weight="730">EdgeOne</text>
        <text x="22" y="101" fill="#A7F3D0" font-size="18">Encrypted Blob</text>
      </g>

      <path d="M430 56H456" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
      <path d="M448 48l8 8-8 8" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(464)">
        <rect width="190" height="112" rx="18" fill="#1B2230" stroke="#394153" stroke-width="2"/>
        <circle cx="30" cy="31" r="8" fill="#A78BFA"/>
        <text x="50" y="39" fill="#DDD6FE" font-size="18" font-weight="700">03</text>
        <text x="22" y="76" fill="#FFFFFF" font-size="27" font-weight="730">Python</text>
        <text x="22" y="101" fill="#98A2B3" font-size="18">Origin API</text>
      </g>

      <path d="M662 56H688" stroke="#A78BFA" stroke-width="3" stroke-linecap="round"/>
      <path d="M680 48l8 8-8 8" fill="none" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(696)">
        <rect width="190" height="112" rx="18" fill="#1B2230" stroke="#394153" stroke-width="2"/>
        <circle cx="30" cy="31" r="8" fill="#F59E0B"/>
        <text x="50" y="39" fill="#FDE68A" font-size="18" font-weight="700">04</text>
        <text x="22" y="76" fill="#FFFFFF" font-size="27" font-weight="730">Scrapling</text>
        <text x="22" y="101" fill="#98A2B3" font-size="18">Static Fetcher</text>
      </g>

      <path d="M894 56H920" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <path d="M912 48l8 8-8 8" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(928)">
        <rect width="152" height="112" rx="18" fill="#1B2230" stroke="#394153" stroke-width="2"/>
        <circle cx="30" cy="31" r="8" fill="#60A5FA"/>
        <text x="50" y="39" fill="#BFDBFE" font-size="18" font-weight="700">05</text>
        <text x="22" y="76" fill="#FFFFFF" font-size="27" font-weight="730">Kitesim</text>
        <text x="22" y="101" fill="#98A2B3" font-size="18">GET API</text>
      </g>
    </g>

    <g transform="translate(60 306)">
      <rect width="1080" height="74" rx="18" fill="#151B26" stroke="#303746" stroke-width="2"/>
      <circle cx="30" cy="37" r="7" fill="#34D399"/>
      <text x="50" y="46" fill="#FFFFFF" font-size="25" font-weight="680">HIT · STALE · EMPTY</text>
      <text x="370" y="46" fill="#98A2B3" font-size="22">显式刷新 → Origin → 加密回写 → REFRESHED</text>
      <rect x="850" y="17" width="208" height="40" rx="20" fill="#EEF2FF"/>
      <text x="874" y="43" fill="#3730A3" font-size="16" font-weight="750">SERVER-ONLY TOKEN</text>
    </g>
  </g>
</svg>
