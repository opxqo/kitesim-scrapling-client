<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Kitesim Relay 运行契约</title>
  <desc id="desc">最多二十个账户、上游只读 GET、Token 仅保存在服务端、普通读取优先使用版本化明文 JSON Blob 快照。</desc>

  <rect x="1" y="1" width="1198" height="498" rx="24" fill="#F8FAFC" stroke="#D8DEE9" stroke-width="2"/>
  <path d="M600 48V452M48 250H1152" stroke="#D8DEE9" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(64 58)">
      <text x="0" y="72" fill="#0F172A" font-size="76" font-weight="760" letter-spacing="-2">20</text>
      <text x="124" y="67" fill="#4F46E5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="750">ACCOUNTS</text>
      <text x="0" y="126" fill="#475569" font-size="30" font-weight="620">多 Token 合并、去重与局部容错</text>
      <path d="M0 166H454" stroke="#C7D2FE" stroke-width="5" stroke-linecap="round"/>
      <circle cx="454" cy="166" r="7" fill="#4F46E5"/>
    </g>

    <g transform="translate(664 58)">
      <text x="0" y="72" fill="#0F172A" font-size="76" font-weight="760" letter-spacing="-2">GET</text>
      <text x="176" y="67" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="750">ONLY</text>
      <text x="0" y="126" fill="#475569" font-size="30" font-weight="620">不发送、不支付、不修改账户</text>
      <path d="M0 166H454" stroke="#A7F3D0" stroke-width="5" stroke-linecap="round"/>
      <circle cx="454" cy="166" r="7" fill="#34D399"/>
    </g>

    <g transform="translate(64 304)">
      <text x="0" y="72" fill="#0F172A" font-size="62" font-weight="760" letter-spacing="-2">SERVER</text>
      <text x="250" y="67" fill="#4F46E5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="750">TOKENS</text>
      <text x="0" y="126" fill="#475569" font-size="30" font-weight="620">浏览器只接收匿名与签名标识</text>
      <path d="M0 166H454" stroke="#C7D2FE" stroke-width="5" stroke-linecap="round"/>
      <circle cx="454" cy="166" r="7" fill="#4F46E5"/>
    </g>

    <g transform="translate(664 304)">
      <text x="0" y="72" fill="#0F172A" font-size="62" font-weight="760" letter-spacing="-2">JSON</text>
      <text x="176" y="67" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="750">BLOB</text>
      <text x="0" y="126" fill="#475569" font-size="30" font-weight="620">明文版本记录，刷新迁移旧 AES</text>
      <path d="M0 166H454" stroke="#A7F3D0" stroke-width="5" stroke-linecap="round"/>
      <circle cx="454" cy="166" r="7" fill="#34D399"/>
    </g>
  </g>
</svg>
